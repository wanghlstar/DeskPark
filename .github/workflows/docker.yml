name: Docker

on:
  push:
    branches: [main, 'game/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deskpark
  # 同时推送到 Docker Hub（群晖 Container Manager 只检测 Docker Hub 的更新）
  # 需在仓库 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME、DOCKERHUB_TOKEN；未配置时自动跳过
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  image:
    name: Build · Smoke test · Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1) 先构建本机架构镜像并实际运行，确认健康检查、网页与接口都正常
      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: deskpark:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name dp -p 8787:8787 deskpark:test
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dp)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' dp)" = "healthy" ]
          curl -fsS http://localhost:8787/healthz
          curl -fsS http://localhost:8787/ | grep -q '闲亭'
          curl -fsS -o /dev/null http://localhost:8787/room/ABCD
          docker logs dp
          docker rm -f dp

      # 2) 推送多架构镜像（PR 只构建不推送）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/deskpark,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build & push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3) 把 README 同步为 Docker Hub 仓库说明（令牌需 Read, Write, Delete 权限）
      - name: Docker Hub description
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/deskpark
          short-description: 闲亭 DeskPark：网页桌游平台，斗地主/掼蛋/双升/麻将，单机人机+多人联机
          enable-url-completion: true
